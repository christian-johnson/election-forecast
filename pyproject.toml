[project]
name = "forecast"
version = "0.1.0"
description = "Polls-only Bayesian forecast for the 2026 US House, Senate, and governor elections."
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "jax",
    "lxml",
    "numpyro",
    "orjson",
    "pandas",
]

[project.scripts]
forecast = "forecast.cli:main"

[dependency-groups]
dev = ["poethepoet", "pytest", "ruff", "scipy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks]
test = "pytest tests"
lint = "ruff check src tests scripts"
format = "ruff format src tests scripts"
"code:fix" = ["format", { cmd = "ruff check --fix src tests scripts" }]
update = "forecast update"

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "ANN", "FBT", "ERA", "TD", "FIX", "COM812", "CPY"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "INP001"]
"scripts/**" = ["INP001", "T201"]
